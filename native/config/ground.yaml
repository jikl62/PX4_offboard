# 地面只读/检查 profile；正式 1.5 m RC 起飞由 flight_test 候选与部署合同生成，不在此配置授权。
# 地面检查配置。正式导航服务的自动起飞使用 flight_test.yaml。
# 下方的范围与速度参数属于通用速度控制路径；1.5 m 自动起飞目标不在此处设置。
fc01_system:
  ros__parameters:
    # 使用本机实际时钟；当前节点不接受 use_sim_time=true。
    # 使用系统实测时间；当前生产节点拒绝模拟时间，不能混用回放时钟。
    use_sim_time: false

    # ground 模式拒绝通用 TAKEOFF 请求，配置校验要求 flight_enabled=false。
    # 选择控制路径；attitude_altitude 使用姿态+推力定高，flight/sim 是另一通用速度路径。
    profile: ground
    # 通用速度飞行入口的独立门；false 不等于其它姿态动作门自动获得权限。
    flight_enabled: false

    # 通用速度控制的活动范围，单位：m。原点在该路径接受起飞任务时记录。
    # 高度表示相对原点向上距离；半径表示距原点的水平距离。
    # 这两个值是范围上限，不是起飞目标。
    # 通用速度路径相对任务原点向上最大高度，单位 m。
    max_height_m: 5.0
    # 通用速度路径距任务原点的水平最大半径，单位 m。
    max_radius_m: 3.0

    # 通用速度指令上限，单位：m/s。
    # 水平限制作用于合速度大小；垂直限制作用于上下速度的绝对值。
    # max_z_speed 同时用于该路径的起飞爬升速度。
    # 通用速度路径水平合速度上限，单位 m/s，不是每轴独立上限。
    max_xy_speed: 0.3
    # 通用速度路径垂直速度绝对值上限，单位 m/s；发送 PX4 NED 时向下为正。
    max_z_speed: 0.3

    # 通用偏航角速度指令的绝对值上限，单位：rad/s（0.5 约为 28.6 度/秒）。
    # 通用速度路径偏航角速度绝对值上限，单位 rad/s。
    max_yaw_rate: 0.5
